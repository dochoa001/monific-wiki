  - nombre: Proyecto
    tipo: custom object
    no_usar: [Edificio, campana padre, Deal padre]
  - nombre: Campana
    tipo: custom object
    no_usar: [tramo, fondeo]
  - nombre: Negocio
    tipo: deal
    no_usar: [Deal]
  - nombre: Ticket
    tipo: ticket
    no_usar: [caso]

