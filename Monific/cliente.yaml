# Ficha maestra de Monific — datos canonicos, legibles por maquina.
#
# REGLA DE CONSISTENCIA: si un dato de este archivo aparece tambien en una pagina de la wiki,
# tienen que coincidir. Cuando un dato cambia, se actualiza AQUI PRIMERO y despues en las paginas.
# Es lo primero que lee una skill o un agente para obtener identificadores sin parsear prosa.

