  slug: monific
  industria: Institucion de Financiamiento Colectivo (crowdfunding inmobiliario)
  regulador: CNBV
  descripcion: >
    Institucion de Financiamiento Colectivo mexicana regulada por la CNBV. Conecta
    inversionistas con solicitantes de financiamiento inmobiliario. Su plataforma
    interna es Admin Monific.
  dominios:
    - monific.com
    - app.monific.com

